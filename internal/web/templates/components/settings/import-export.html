{{define "settings-import-export"}}
<section class="form-container half-width">
    <h2 align="center">{{.T "import.title"}}</h2>
    <div class="export-buttons">
        <div class="export-options">
            <a href="/export/csv" id="csv-export-file" class="nav-button" download="expenses.csv">{{.T "import.export"}}</a>
        </div>
        <div class="import-option">
            <label for="csv-import-file" class="nav-button">{{.T "import.import"}}</label>
            <input type="file" id="csv-import-file" accept=".csv">
        </div>
    </div>
    <div id="importMessage" class="form-message"></div>
    <div id="importSummary" class="import-summary" hidden>
        <h3>{{.T "import.summary"}}</h3>
        <p>{{.T "import.processed"}} <span id="summary-processed"></span></p>
        <p>{{.T "import.imported"}} <span id="summary-imported"></span></p>
        <p>{{.T "import.skipped"}} <span id="summary-skipped"></span></p>
        <p>{{.T "import.categories"}} <span id="summary-new-categories"></span></p>
    </div>
</section>
{{end}}
