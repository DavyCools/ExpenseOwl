{{define "transaction-table"}}
<div id="tableContainer"></div>
<template id="transaction-table-template">
    <table class="expense-table">
        <thead>
            <tr><th>{{.T "common.name"}}</th><th>{{.T "common.category"}}</th><th class="tags-column" data-tags>{{.T "common.tags"}}</th><th>{{.T "common.amount"}}</th><th class="date-header">{{.T "common.date"}}</th><th></th></tr>
            <tr class="filter-row">
                <th><input type="text" id="filter-name" data-filter="name" class="form-filter-input" placeholder="{{.T "common.filter"}}"></th>
                <th><div class="custom-multiselect" id="filter-category-container" data-multiselect="category">
                    <button type="button" class="multiselect-display" id="filter-category-display" aria-expanded="false">{{.T "table.allCategories"}}</button>
                    <div class="multiselect-dropdown" id="filter-category-dropdown" hidden></div>
                </div></th>
                <th class="tags-column" data-tags><div class="custom-multiselect" id="filter-tags-container" data-multiselect="tags">
                    <button type="button" class="multiselect-display" id="filter-tags-display" aria-expanded="false">{{.T "table.allTags"}}</button>
                    <div class="multiselect-dropdown" id="filter-tags-dropdown" hidden></div>
                </div></th>
                <th><input type="number" id="filter-amount" data-filter="amount" class="form-filter-input" placeholder="{{.T "common.filter"}}"></th>
                <th class="date-header"><input type="date" id="filter-date" data-filter="date" class="form-filter-input" placeholder="{{.T "common.filter"}}"></th>
                <th></th>
            </tr>
        </thead>
        <tbody id="expense-table-body"></tbody>
    </table>
</template>
<template id="transaction-filter-option-template">
    <label class="multiselect-option"><input type="checkbox"><span></span></label>
</template>
<template id="transaction-row-template">
    <tr>
        <td data-name></td><td data-category></td><td class="tags-column" data-tags></td>
        <td class="amount" data-amount></td><td class="date-column" data-date></td>
        <td>
            <button class="edit-button" data-edit aria-label="{{.T "common.edit"}}"><i class="fa-solid fa-pen-to-square"></i></button>
            <button class="delete-button" data-delete aria-label="{{.T "common.delete"}}"><i class="fa-solid fa-trash-can"></i></button>
        </td>
    </tr>
</template>
<template id="transaction-empty-row-template"><tr><td class="no-data filtered-empty">{{.T "table.emptyFiltered"}}</td></tr></template>
<div id="deleteModal" class="modal">
    <div class="modal-content">
        <h3>{{.T "table.deleteTitle"}}</h3>
        <p>{{.T "table.deleteConfirm"}}</p>
        <div class="modal-buttons">
            <button class="modal-button" data-cancel-delete>{{.T "common.cancel"}}</button>
            <button class="modal-button confirm" data-confirm-delete>{{.T "common.delete"}}</button>
        </div>
    </div>
</div>
{{end}}
