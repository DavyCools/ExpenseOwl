{{define "settings-recurring-transactions"}}
<section class="form-container">
    <h2 align="center">{{.T "recurring.title"}}</h2>
    <form id="recurringExpenseForm" class="expense-form recurring-expense-form">
        <div class="form-group">
            <label for="recurringName">{{.T "common.name"}}</label>
            <input type="text" id="recurringName" required>
        </div>
        <div class="form-group">
            <label for="recurringAmount">{{.T "common.amount"}}</label>
            <input type="number" id="recurringAmount" step="0.01" min="0.01" max="9000000000000000" required>
        </div>
        <div class="form-group">
            <label for="recurringCategory">{{.T "common.category"}}</label>
            <select id="recurringCategory" required></select>
        </div>
        <div class="form-group">
            <label for="tags-input">{{.T "common.tags"}}</label>
            <div class="tags-input-container">
                <div id="selected-tags" class="selected-tags"></div>
                <input type="text" id="tags-input" placeholder="{{.T "common.optional"}}">
            </div>
            <div id="tags-dropdown" class="tags-dropdown"></div>
        </div>
        <div class="form-group">
            <label for="recurringInterval">{{.T "common.interval"}}</label>
            <select id="recurringInterval" required>
                <option value="daily">{{.T "common.daily"}}</option>
                <option value="weekly">{{.T "common.weekly"}}</option>
                <option value="monthly">{{.T "common.monthly"}}</option>
                <option value="yearly">{{.T "common.yearly"}}</option>
            </select>
        </div>
        <div class="form-group">
            <label for="recurringStartDate">{{.T "common.startDate"}}</label>
            <input type="date" id="recurringStartDate" required>
        </div>
        <div class="form-group">
            <label for="recurringOccurrences">{{.T "common.occurrences"}}</label>
            <input type="number" id="recurringOccurrences" min="2" value="2" required>
        </div>
        <div class="form-group form-group-checkbox">
            <label for="recurringReportGain">{{.T "common.gain"}}</label>
            <input type="checkbox" id="recurringReportGain" class="styled-checkbox">
        </div>
        <button type="submit" class="nav-button">{{.T "recurring.add"}}</button>
    </form>
    <div id="recurringExpenseMessage" class="form-message"></div>
    <h3 align="center" class="recurring-expense-heading">{{.T "recurring.existing"}}</h3>
    <div id="recurring-expenses-list"></div>
</section>

<div id="deleteRecurringModal" class="modal">
    <div class="modal-content">
        <h3>{{.T "recurring.delete"}}</h3>
        <p>{{.T "recurring.deleteQuestion"}}</p>
        <div class="modal-buttons">
            <button class="modal-button" type="button" data-action="close-delete">{{.T "common.cancel"}}</button>
            <button class="modal-button" type="button" data-action="delete-recurring" data-remove-all="false">{{.T "recurring.deleteFuture"}}</button>
            <button class="modal-button confirm" type="button" data-action="delete-recurring" data-remove-all="true">{{.T "recurring.deleteAll"}}</button>
        </div>
    </div>
</div>

<div id="editRecurringModal" class="modal">
    <div class="modal-content">
        <h3>{{.T "recurring.edit"}}</h3>
        <form id="editRecurringExpenseForm" class="expense-form recurring-expense-form">
            <div class="form-group">
                <label for="editRecurringName">{{.T "common.name"}}</label>
                <input type="text" id="editRecurringName" required>
            </div>
            <div class="form-group">
                <label for="editRecurringAmount">{{.T "common.amount"}}</label>
                <input type="number" id="editRecurringAmount" step="0.01" min="0" required>
            </div>
            <div class="form-group">
                <label for="editRecurringCategory">{{.T "common.category"}}</label>
                <select id="editRecurringCategory" required></select>
            </div>
            <div class="form-group">
                <label for="edit-tags-input">{{.T "common.tags"}}</label>
                <div class="tags-input-container">
                    <div id="edit-selected-tags" class="selected-tags"></div>
                    <input type="text" id="edit-tags-input" placeholder="{{.T "common.optional"}}">
                </div>
                <div id="edit-tags-dropdown" class="tags-dropdown"></div>
            </div>
            <div class="form-group">
                <label for="editRecurringInterval">{{.T "common.interval"}}</label>
                <select id="editRecurringInterval" required>
                    <option value="daily">{{.T "common.daily"}}</option>
                    <option value="weekly">{{.T "common.weekly"}}</option>
                    <option value="monthly">{{.T "common.monthly"}}</option>
                    <option value="yearly">{{.T "common.yearly"}}</option>
                </select>
            </div>
            <div class="form-group">
                <label for="editRecurringStartDate">{{.T "common.startDate"}}</label>
                <input type="date" id="editRecurringStartDate" required>
            </div>
            <div class="form-group">
                <label for="editRecurringOccurrences">{{.T "recurring.indefinite"}}</label>
                <input type="number" id="editRecurringOccurrences" min="0" value="0" required>
            </div>
            <div class="form-group form-group-checkbox">
                <label for="editRecurringReportGain">{{.T "common.gain"}}</label>
                <input type="checkbox" id="editRecurringReportGain" class="styled-checkbox">
            </div>
        </form>
        <div class="modal-buttons">
            <button class="modal-button" type="button" data-action="close-edit">{{.T "common.cancel"}}</button>
            <button class="modal-button" type="button" data-action="update-recurring" data-update-all="false">{{.T "recurring.updateFuture"}}</button>
            <button class="modal-button confirm" type="button" data-action="update-recurring" data-update-all="true">{{.T "recurring.updateAll"}}</button>
        </div>
    </div>
</div>

<template id="recurring-empty-template">
    <p>{{.T "recurring.empty"}}</p>
</template>
<template id="recurring-error-template">
    <p>{{.T "recurring.loadFailed"}}</p>
</template>
<template id="recurring-table-template">
    <table class="expense-table">
        <thead>
            <tr><th>{{.T "common.name"}}</th><th>{{.T "common.amount"}}</th><th>{{.T "common.category"}}</th><th>{{.T "common.interval"}}</th><th>{{.T "recurring.next"}}</th><th></th></tr>
        </thead>
        <tbody></tbody>
    </table>
</template>
<template id="recurring-row-template">
    <tr>
        <td data-field="name"></td>
        <td data-field="amount"></td>
        <td data-field="category"></td>
        <td data-field="interval"></td>
        <td data-field="next-occurrence"></td>
        <td>
            <button class="edit-button" type="button" data-action="edit-recurring" aria-label="{{.T "common.edit"}}"><i class="fa-solid fa-pen-to-square"></i></button>
            <button class="delete-button" type="button" data-action="show-delete" aria-label="{{.T "common.delete"}}"><i class="fa-solid fa-trash-can"></i></button>
        </td>
    </tr>
</template>
{{end}}
