{{define "transaction-table"}}
<div id="tableContainer"></div>
<template id="transaction-table-template">
    <table class="expense-table">
        <thead>
            <tr><th>Name</th><th>Category</th><th class="tags-column" data-tags>Tags</th><th>Amount</th><th class="date-header">Date</th><th></th></tr>
            <tr class="filter-row">
                <th><input type="text" id="filter-name" data-filter="name" class="form-filter-input" placeholder="Filter"></th>
                <th><input type="text" id="filter-category" data-filter="category" class="form-filter-input" placeholder="Filter"></th>
                <th class="tags-column" data-tags><input type="text" id="filter-tags" data-filter="tags" class="form-filter-input" placeholder="Filter"></th>
                <th><input type="number" id="filter-amount" data-filter="amount" class="form-filter-input" placeholder="Filter"></th>
                <th class="date-header"><input type="date" id="filter-date" data-filter="date" class="form-filter-input" placeholder="Filter"></th>
                <th></th>
            </tr>
        </thead>
        <tbody id="expense-table-body"></tbody>
    </table>
</template>
<template id="transaction-row-template">
    <tr>
        <td data-name></td><td data-category></td><td class="tags-column" data-tags></td>
        <td class="amount" data-amount></td><td class="date-column" data-date></td>
        <td>
            <button class="edit-button" data-edit><i class="fa-solid fa-pen-to-square"></i></button>
            <button class="delete-button" data-delete><i class="fa-solid fa-trash-can"></i></button>
        </td>
    </tr>
</template>
<template id="transaction-empty-row-template"><tr><td class="no-data filtered-empty">No transactions found with current filters.</td></tr></template>
<div id="deleteModal" class="modal">
    <div class="modal-content">
        <h3>Delete Expense</h3>
        <p>Are you sure you want to delete this expense? (cannot be undone)</p>
        <div class="modal-buttons">
            <button class="modal-button" data-cancel-delete>Cancel</button>
            <button class="modal-button confirm" data-confirm-delete>Delete</button>
        </div>
    </div>
</div>
{{end}}
