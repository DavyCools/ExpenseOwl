{{define "transaction-controls"}}
        <div class="time-range-wrapper">
            <div class="table-controls">
                <label>
                    <input type="radio" id="showMonthToggle" class="pointer" name="timeRange" value="month" checked>
                    <label for="showMonthToggle" class="pointer">{{.T "controls.monthly"}}</label><br>
                </label>
                <label>
                    <input type="radio" id="showYearToggle" class="pointer" name="timeRange" value="year">
                    <label for="showYearToggle" class="pointer">{{.T "controls.yearly"}}</label><br>
                </label>
                <label>
                    <input type="radio" id="showAllToggle" class="pointer" name="timeRange" value="all">
                    <label for="showAllToggle" class="pointer">{{.T "controls.all"}}</label>
                </label>
            </div>
        </div>

        <div class="expense-navigation" id="month-navigation">
            <button aria-label="{{.T "controls.previousMonth"}}" id="prevMonth" class="nav-button"><i class="fa-solid fa-arrow-left"></i></button>
            <div class="current-date" id="currentMonth"></div>
            <button aria-label="{{.T "controls.nextMonth"}}" id="nextMonth" class="nav-button"><i class="fa-solid fa-arrow-right"></i></button>
        </div>

        <div class="expense-navigation" id="year-navigation">
            <button aria-label="{{.T "controls.previousYear"}}" id="prevYear" class="nav-button"><i class="fa-solid fa-arrow-left"></i></button>
            <div class="current-date" id="currentYear"></div>
            <button aria-label="{{.T "controls.nextYear"}}" id="nextYear" class="nav-button"><i class="fa-solid fa-arrow-right"></i></button>
        </div>

        <div class="transaction-visibility" hidden>
            <label class="future-switch">
                <input type="checkbox" id="includeFutureToggle" role="switch" autocomplete="off">
                <span class="future-switch-track" aria-hidden="true"></span>
                <span>{{.T "controls.future"}}</span>
            </label>
        </div>

{{end}}
